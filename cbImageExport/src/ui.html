<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>画像一括書き出しくん</title>
  </head>
  <body>
    <div class="app">
      <section class="section">
        <div class="scope-row">
          <div id="target-picker-root" class="target-picker-row"></div>
          <div class="scope-actions">
            <button
              id="export-all"
              class="btn-icon primary"
              type="button"
              title="書き出し"
              aria-label="書き出し"
            >
              <svg
                width="14"
                height="16"
                viewBox="0 0 14 16"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path
                  d="M7 1V10M7 10L3.5 6.5M7 10L10.5 6.5M1 12.5V13.5C1 14 1.4 14.4 1.9 14.4H12.1C12.6 14.4 13 14 13 13.5V12.5"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button
              id="rescan"
              class="btn-icon"
              type="button"
              title="再読み込み"
              aria-label="再読み込み"
            >
              <svg
                width="14"
                height="16"
                viewBox="0 0 14 16"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path
                  d="M12.6 12C11.4 13.5 9.6 14.5 7.5 14.5C3.9 14.5 1 11.6 1 8C1 4.4 3.9 1.5 7.5 1.5C9.7 1.5 11.6 2.6 12.8 4.2M13 1V4C13 4.3 12.8 4.5 12.5 4.5H9.5"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
        </div>
      </section>

      <div class="tabs" role="tablist">
        <button
          id="tab-layers"
          class="tab"
          type="button"
          role="tab"
          data-tab="layers"
          aria-controls="panel-layers"
          aria-selected="true"
        >
          レイヤー
        </button>
        <button
          id="tab-export"
          class="tab"
          type="button"
          role="tab"
          data-tab="export"
          aria-controls="panel-export"
          aria-selected="false"
        >
          エクスポート <span id="export-count" class="tab-count"></span>
        </button>
      </div>

      <div class="tab-panels">
      <div id="panel-layers" class="tab-panel" role="tabpanel" aria-labelledby="tab-layers">
      <section class="section selection-section" aria-labelledby="selection-label">
        <h2 id="selection-label">選択中のレイヤー</h2>
        <ul id="selection-list" class="selection-list"></ul>
      </section>

      <hr class="divider" />

      <section class="section image-section" aria-labelledby="image-list-label">
        <h2 id="image-list-label">画像一覧</h2>
        <ul id="image-list" class="results image-list"></ul>
      </section>
      </div>

      <div id="panel-export" class="tab-panel" role="tabpanel" aria-labelledby="tab-export" hidden>
      <section class="section results-section" aria-labelledby="tab-export">
        <div class="results-head">
          <div class="results-actions">
            <label class="select-all">
              <input id="select-all" type="checkbox" />
              <span>すべて</span>
            </label>
            <button id="asset-url-trigger" class="btn-icon asset-url-trigger" type="button" title="URL コピー設定" aria-label="URL コピー設定" aria-haspopup="true" aria-expanded="false">
              <svg
                width="14"
                height="14"
                viewBox="0 0 16 16"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>
        <p id="error" class="error" hidden></p>
        <p id="status" class="status" hidden></p>
        <ul id="results" class="results"></ul>
      </section>
      </div>
      </div>
    </div>
    <div
      id="resize-handle"
      class="resize-handle"
      title="高さをドラッグで調整"
      aria-label="高さをドラッグで調整"
      role="separator"
      aria-orientation="horizontal"
    ></div>
    <script type="module" src="./ui.ts"></script>
  </body>
</html>
