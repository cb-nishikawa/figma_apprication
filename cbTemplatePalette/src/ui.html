<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>テンプレパレットくん</title>
  </head>
  <body>
    <div class="app">
      <section class="section list-section" aria-labelledby="list-label">
        <div class="list-head">
          <div class="list-title">
            <h2 id="list-label">保存した要素</h2>
            <span id="count" class="list-count"></span>
          </div>
          <div class="list-head-actions">
            <div class="category-menu">
              <button
                id="category-toggle"
                class="btn-icon"
                type="button"
                title="カテゴリ: 未設定"
                aria-label="保存するカテゴリを選ぶ"
                aria-haspopup="true"
                aria-expanded="false"
                aria-controls="category-popover"
              >
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path
                    d="M13.5 8.5 8.5 13.5 2.5 7.5v-4a1 1 0 0 1 1-1h4z"
                    stroke="currentColor"
                    stroke-width="1.3"
                    stroke-linejoin="round"
                  />
                  <circle cx="5.6" cy="5.6" r="1.1" fill="currentColor" />
                </svg>
              </button>
              <div id="category-popover" class="view-menu-popover" hidden role="menu" aria-label="カテゴリ"></div>
            </div>
            <div class="view-menu">
              <button
                id="view-mode-toggle"
                class="btn-icon"
                type="button"
                title="表示を切り替える"
                aria-label="表示を切り替える"
                aria-haspopup="true"
                aria-expanded="false"
                aria-controls="view-mode-popover"
              >
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <rect x="2" y="2.5" width="12" height="3" rx="1" stroke="currentColor" stroke-width="1.3" />
                  <path d="M2 9h12M2 12h12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
                </svg>
              </button>
              <div id="view-mode-popover" class="view-menu-popover" hidden role="menu" aria-label="表示"></div>
            </div>
            <div class="filter-menu">
              <button
                id="filter-toggle"
                class="btn-icon"
                type="button"
                title="名前で絞り込み"
                aria-label="名前で絞り込み"
                aria-expanded="false"
                aria-controls="filter-popover"
              >
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path
                    d="M2.5 3.5h11L10 9v4h-4V9z"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
              <div id="filter-popover" class="filter-popover" hidden>
                <input
                  id="filter"
                  class="text-input"
                  type="text"
                  placeholder="名前で絞り込み"
                  aria-label="名前で絞り込み"
                  spellcheck="false"
                  autocomplete="off"
                />
              </div>
            </div>
            <div class="list-menu">
              <button
                id="list-menu-toggle"
                class="btn-icon"
                type="button"
                title="一覧のメニュー"
                aria-label="一覧のメニュー"
                aria-expanded="false"
                aria-controls="list-menu-popover"
              >
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <circle cx="8" cy="3.5" r="1.4" fill="currentColor" />
                  <circle cx="8" cy="8" r="1.4" fill="currentColor" />
                  <circle cx="8" cy="12.5" r="1.4" fill="currentColor" />
                </svg>
              </button>
              <div id="list-menu-popover" class="list-menu-popover" hidden role="menu">
                <button id="add-category" class="row-menu-item" type="button" role="menuitem">
                  カテゴリを追加
                </button>
                <button id="add-group" class="row-menu-item" type="button" role="menuitem">
                  グループを追加
                </button>
              </div>
            </div>
          </div>
        </div>
        <p id="error" class="error" hidden></p>
        <ul id="list" class="template-list" role="tree" aria-label="保存した要素"></ul>
      </section>
    </div>
    <footer class="footer">
      <div class="footer-info">
        <p id="selection-hint" class="hint"></p>
        <div id="status" class="status">
          <span id="status-spinner" class="spinner" hidden aria-hidden="true"></span>
          <span id="status-text" class="status-text"></span>
        </div>
        <div id="usage-bar" class="usage-bar" hidden aria-hidden="true">
          <span id="usage-bar-fill" class="usage-bar-fill"></span>
        </div>
      </div>
      <div class="footer-actions">
        <button
          id="import"
          class="btn-icon"
          type="button"
          title="書き出したファイルからテンプレートを読み込みます"
          aria-label="読み込む"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M8 10.5V2.5M8 2.5 4.5 6M8 2.5 11.5 6"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M2 10.5v1.5A1.5 1.5 0 0 0 3.5 13.5h9a1.5 1.5 0 0 0 1.5-1.5v-1.5"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button
          id="export-all"
          class="btn-icon"
          type="button"
          title="すべてのテンプレートを 1 つのファイルに書き出します"
          aria-label="すべて書き出す"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M8 2.5v8M8 10.5 4.5 7M8 10.5 11.5 7"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M2 10.5v1.5A1.5 1.5 0 0 0 3.5 13.5h9a1.5 1.5 0 0 0 1.5-1.5v-1.5"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button id="save" class="btn-primary" type="button" hidden>
          追加
        </button>
        <button id="place" class="btn-primary" type="button" hidden>
          複製
        </button>
      </div>
      <input id="import-file" type="file" accept=".json,application/json" multiple hidden />
    </footer>
    <div id="image-dialog" class="image-dialog" hidden>
      <div
        class="image-dialog-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="image-dialog-title"
        aria-describedby="image-dialog-body"
      >
        <p id="image-dialog-title" class="image-dialog-title">画像を含めますか？</p>
        <p id="image-dialog-body" class="image-dialog-body"></p>
        <p id="image-dialog-note" class="image-dialog-note" hidden></p>
        <div class="image-dialog-actions">
          <button id="image-cancel" class="btn-secondary" type="button">キャンセル</button>
          <button id="image-skip" class="btn-secondary" type="button">画像を含めない</button>
          <button id="image-keep" class="btn-primary" type="button">画像を含める</button>
        </div>
      </div>
    </div>
    <div id="import-dialog" class="image-dialog" hidden>
      <div
        class="image-dialog-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="import-dialog-title"
        aria-describedby="import-dialog-body"
      >
        <p id="import-dialog-title" class="image-dialog-title">読み込み方を選んでください</p>
        <p id="import-dialog-body" class="image-dialog-body"></p>
        <p id="import-dialog-note" class="image-dialog-note" hidden></p>
        <div id="import-actions" class="import-dialog-actions">
          <button id="import-replace" class="btn-secondary is-danger" type="button">
            全て入れ替える
          </button>
          <button id="import-append" class="btn-primary" type="button">末尾に追加</button>
          <button id="import-category" class="btn-secondary" type="button">
            カテゴリにして追加
          </button>
          <button id="import-cancel" class="btn-secondary is-quiet" type="button">
            キャンセル
          </button>
        </div>
        <div id="import-confirm-actions" class="import-dialog-actions" hidden>
          <button id="import-back" class="btn-secondary" type="button">戻る</button>
          <button id="import-confirm-replace" class="btn-secondary is-danger" type="button">
            全て入れ替える
          </button>
        </div>
      </div>
    </div>
    <div
      id="resize-handle"
      class="resize-handle"
      title="高さをドラッグで調整"
      aria-label="高さをドラッグで調整"
      role="separator"
      aria-orientation="horizontal"
    ></div>
    <script type="module" src="./ui.ts"></script>
  </body>
</html>
