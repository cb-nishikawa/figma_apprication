<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>もじ検索比較くん</title>
  </head>
  <body>
    <div class="app">
      <section class="section scope-section">
        <div class="mode-row" role="radiogroup" aria-label="検索範囲">
          <label class="radio">
            <input type="radio" name="mode" value="pinned" checked />
            <span>検索</span>
          </label>
          <label class="radio">
            <input type="radio" name="mode" value="compare" />
            <span>比較</span>
          </label>
          <label class="radio">
            <input type="radio" name="mode" value="image" />
            <span>画像</span>
          </label>
        </div>
        <div id="pin-inline" class="pin-inline">
          <div class="pin-row">
            <div class="pin-combobox">
              <input
                id="pin-combobox-input"
                class="pin-combobox-input"
                type="text"
                role="combobox"
                aria-autocomplete="list"
                aria-controls="pin-combobox-list"
                aria-expanded="false"
                aria-label="固定先"
                placeholder="名前で検索 / 選択"
                autocomplete="off"
              />
              <ul
                id="pin-combobox-list"
                class="pin-combobox-list"
                role="listbox"
                hidden
              ></ul>
            </div>
            <button
              id="pin-from-selection"
              class="btn-icon"
              type="button"
              title="選択を固定に"
              aria-label="選択を固定に"
            ></button>
          </div>
        </div>
        <div id="compare-inline" class="compare-inline" hidden>
          <div id="compare-pairs" class="compare-pairs"></div>
          <button
            id="add-compare-pair"
            class="btn-add-full"
            type="button"
            title="比較ペアを追加"
            aria-label="比較ペアを追加"
          >
            ＋
          </button>
        </div>
        <div id="image-inline" class="image-inline" hidden>
          <div class="compare-pair-row">
            <div class="compare-pair-sides">
              <div class="compare-side">
                <div class="compare-side-top">
                  <span class="compare-side-label">画</span>
                  <span id="image-name" class="image-name">画像未選択</span>
                  <button
                    id="image-from-selection"
                    class="btn-icon"
                    type="button"
                    title="選択から画像"
                    aria-label="選択から画像"
                  ></button>
                </div>
              </div>
              <div class="compare-side">
                <div class="compare-side-top">
                  <span class="compare-side-label">比</span>
                  <div class="pin-combobox">
                    <input
                      id="image-target-input"
                      class="pin-combobox-input"
                      type="text"
                      role="combobox"
                      aria-autocomplete="list"
                      aria-controls="image-target-list"
                      aria-expanded="false"
                      aria-label="比較ターゲット"
                      placeholder="ターゲット（任意）"
                      autocomplete="off"
                    />
                    <ul
                      id="image-target-list"
                      class="pin-combobox-list"
                      role="listbox"
                      hidden
                    ></ul>
                  </div>
                  <button
                    id="image-target-from-selection"
                    class="btn-icon"
                    type="button"
                    title="選択をターゲットに"
                    aria-label="選択をターゲットに"
                  ></button>
                </div>
              </div>
            </div>
            <div id="image-row-actions" class="compare-pair-actions"></div>
          </div>
          <div id="ocr-status" class="ocr-status" hidden>
            <span class="ocr-spinner" aria-hidden="true"></span>
            <span id="ocr-status-text" class="ocr-status-text"></span>
          </div>
        </div>
      </section>

      <hr id="keywords-divider" class="divider" />

      <section id="keywords-section" class="section keywords-section">
        <div id="keyword-rows" class="keyword-rows"></div>
        <button
          id="add-keyword"
          class="btn-add-full"
          type="button"
          title="行を追加"
          aria-label="行を追加"
        >
          ＋
        </button>
      </section>

      <hr class="divider" />

      <section class="section results-section" aria-labelledby="results-label">
        <div class="results-head">
          <h2 id="results-label">チェック結果</h2>
          <div class="results-head-actions">
            <div class="ignore-menu">
              <button
                id="ignore-toggle"
                class="btn-icon"
                type="button"
                title="無視する文字列"
                aria-label="無視する文字列"
                aria-expanded="false"
                aria-controls="ignore-popover"
              ></button>
              <div id="ignore-popover" class="ignore-popover" hidden>
                <input
                  id="ignore-strings"
                  class="ignore-input"
                  type="text"
                  placeholder="追加で無視（空白区切り）例: ・"
                  spellcheck="false"
                  autocomplete="off"
                />
                <div
                  class="ignore-categories"
                  role="group"
                  aria-label="無視する種類"
                >
                  <label class="ignore-check">
                    <input type="checkbox" id="ignore-emoji" checked />
                    <span>絵文字</span>
                  </label>
                  <label class="ignore-check">
                    <input type="checkbox" id="ignore-kinsoku" checked />
                    <span>禁則</span>
                  </label>
                  <label class="ignore-check">
                    <input type="checkbox" id="ignore-symbol" checked />
                    <span>記号</span>
                  </label>
                  <label class="ignore-check">
                    <input type="checkbox" id="ignore-punct" checked />
                    <span>句読点</span>
                  </label>
                  <label class="ignore-check">
                    <input type="checkbox" id="ignore-newlines" checked />
                    <span>改行</span>
                  </label>
                  <label class="ignore-check">
                    <input type="checkbox" id="ignore-whitespace" />
                    <span>空白</span>
                  </label>
                </div>
              </div>
            </div>
            <button
              id="reset-search"
              class="btn-icon"
              type="button"
              title="再検索"
              aria-label="再検索"
            ></button>
            <button
              id="clear-all"
              class="btn-icon"
              type="button"
              title="すべてクリア"
              aria-label="すべてクリア"
            ></button>
          </div>
        </div>
        <p id="error" class="error" hidden></p>
        <ul id="results" class="results"></ul>
      </section>
    </div>
    <div
      id="resize-handle"
      class="resize-handle"
      title="高さをドラッグで調整"
      aria-label="高さをドラッグで調整"
      role="separator"
      aria-orientation="horizontal"
    ></div>
    <script type="module" src="./ui.ts"></script>
  </body>
</html>
