<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>コンポーネント一覧くん</title>
    <!-- inject:css -->
  </head>
  <body>
    <div class="app">
      <div id="view-components" class="view">
        <section class="section scope-section">
          <div id="pin-picker-root" class="target-picker-row"></div>
          <p id="status" class="status" hidden></p>
        </section>

        <hr class="divider" />

        <section
          class="section section-fill"
          aria-label="Components"
        >
          <div class="components-header">
            <div class="component-search">
              <button
                id="component-search-toggle"
                class="btn-icon"
                type="button"
                title="検索"
                aria-label="検索"
                aria-expanded="false"
                aria-controls="component-search-popover"
              >
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.2" />
                  <line x1="9.5" y1="9.5" x2="12" y2="12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
                </svg>
              </button>
              <div id="component-search-popover" class="ignore-popover" hidden>
                <input
                  id="component-search-input"
                  class="ignore-input"
                  type="text"
                  placeholder="名前で絞り込み"
                  spellcheck="false"
                  autocomplete="off"
                />
                <div class="ignore-categories" role="group" aria-label="検索対象">
                  <label class="ignore-check">
                    <input type="checkbox" id="search-scope-components" checked />
                    <span>コンポーネント</span>
                  </label>
                  <label class="ignore-check">
                    <input type="checkbox" id="search-scope-instances" checked />
                    <span>インスタンス</span>
                  </label>
                </div>
              </div>
            </div>
            <div class="mode-row" role="radiogroup" aria-label="並び替え">
              <label class="radio">
                <input type="radio" name="sort" value="layer" checked />
                <span>レイヤー順</span>
              </label>
              <label class="radio">
                <input type="radio" name="sort" value="name" />
                <span>名前順</span>
              </label>
            </div>
          </div>
          <div id="components" class="list list-scroll"></div>
          <p id="components-empty" class="empty" hidden>一致する項目がありません</p>
        </section>
      </div>

      <div id="view-instances" class="view" hidden>
        <section class="section">
          <button type="button" id="back-btn" class="back-btn">← 戻る</button>
          <p id="instance-heading" class="instance-heading"></p>
        </section>

        <hr class="divider" />

        <section class="section section-fill" aria-labelledby="instances-label">
          <h2 id="instances-label">インスタンス一覧</h2>
          <div id="instances" class="list list-scroll"></div>
          <p id="instances-empty" class="empty" hidden></p>
        </section>
      </div>
    </div>
    <div
      id="resize-handle"
      class="resize-handle"
      title="高さをドラッグで調整"
      aria-label="高さをドラッグで調整"
      role="separator"
      aria-orientation="horizontal"
    ></div>

    <!-- inject:js -->
  </body>
</html>
